---
services:
  apigw:
    container_name: "vc_dev_apigw"
    hostname: "apigw.vc.docker"
    image: docker.sunet.se/iam_vc/apigw:latest
    restart: always
    volumes:
      - ./developer_tools/pki/:/pki:ro
      - ./config_minimal.yaml:/config.yaml:ro
      - ./metadata/:/metadata/:ro
      - /var/log/sunet:/var/log/sunet
    depends_on:
      - mongo
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.2
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      # Trust the dev rootCA for inter-service TLS (Go reads SSL_CERT_FILE)
      - "SSL_CERT_FILE=/pki/rootCA.crt"

  ui:
    container_name: "vc_dev_ui"
    hostname: "ui.vc.docker"
    image: docker.sunet.se/iam_vc/ui:latest
    restart: always
    volumes:
      - ./developer_tools/pki/:/pki:ro
      - ./config_minimal.yaml:/config.yaml:ro
    depends_on:
      #      apigw:
      #        condition: service_started
      #      mockas:
      #        condition: service_started
      #      kafka0:
      #        condition: service_healthy
      - apigw
      - mockas
      - verifier
      #- kafka0
      #- kafka1
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.50
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      - "SSL_CERT_FILE=/pki/rootCA.crt"

  issuer:
    container_name: "vc_dev_issuer"
    hostname: "issuer.vc.docker"
    image: docker.sunet.se/iam_vc/issuer:latest
    restart: always
    volumes:
      - ./developer_tools/pki/:/pki:ro
      - ./config_minimal.yaml:/config.yaml:ro
      - ./metadata/:/metadata/:ro
      - /var/log/sunet:/var/log/sunet
    depends_on:
      - mongo
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.4
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      - "SSL_CERT_FILE=/pki/rootCA.crt"

  verifier:
    container_name: "vc_dev_verifier"
    hostname: "verifier.vc.docker"
    image: docker.sunet.se/iam_vc/verifier:latest
    restart: always
    volumes:
      - ./config_minimal.yaml:/config.yaml:ro
      - ./developer_tools/pki/:/pki:ro
      - ./metadata/:/metadata/:ro
      - ./internal/verifier/static:/static:ro
      - ./presentation_requests:/presentation_requests:ro
    depends_on:
      - mongo
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.6
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      - "SSL_CERT_FILE=/pki/rootCA.crt"

  registry:
    container_name: "vc_dev_registry"
    hostname: "registry.vc.docker"
    image: docker.sunet.se/iam_vc/registry:latest
    restart: always
    volumes:
      - ./developer_tools/pki/:/pki:ro
      - ./config_minimal.yaml:/config.yaml:ro
    depends_on:
      - mongo
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.8
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      - "SSL_CERT_FILE=/pki/rootCA.crt"

  mockas:
    container_name: "vc_dev_mockas"
    hostname: "mockas.vc.docker"
    image: docker.sunet.se/iam_vc/mockas:latest
    restart: always
    volumes:
      - ./developer_tools/pki/:/pki:ro
      - ./config_minimal.yaml:/config.yaml:ro
    depends_on:
      apigw:
        condition: service_healthy
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.13
    environment:
      - "VC_CONFIG_YAML=config.yaml"
      - "SSL_CERT_FILE=/pki/rootCA.crt"


  mongo:
    image: mongo:7.0
    container_name: "vc_dev_mongo"
    hostname: "mongo.vc.docker"
    restart: always
    expose:
      - 27017
    volumes:
      - mongo_data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      start_period: 3s
    networks:
      vc-dev-net:
        ipv4_address: 172.16.50.20

