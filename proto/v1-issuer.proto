syntax = "proto3";

package v1.issuer;

option go_package = "vc/internal/gen/issuer/apiv1_issuer";

//import "google/protobuf/timestamp.proto";
//import "google/protobuf/any.proto";

service IssuerService {
    rpc MakeSDJWT (MakeSDJWTRequest) returns (MakeSDJWTReply) {}
    rpc MakeMDoc (MakeMDocRequest) returns (MakeMDocReply) {}
    rpc MakeVC20 (MakeVC20Request) returns (MakeVC20Reply) {}
    rpc MakeJWP (MakeJWPRequest) returns (MakeJWPReply) {}
    rpc JWKS (Empty) returns (JwksReply) {}
    rpc SignMetadata (SignMetadataRequest) returns (SignMetadataReply) {}
    rpc GetIACAs (Empty) returns (GetIACAsReply) {}
}

// SignMetadataRequest asks the issuer to sign metadata JSON with its own key
// (the same key advertised in JWKS), so that signed_metadata is verifiable.
message SignMetadataRequest {
    bytes metadata_json = 1;    // Raw JSON of the metadata to sign
    string metadata_type = 2;   // Metadata type selector (e.g., "vci-issuer", "oauth2-authorization-server")
    string iss = 3;             // Issuer claim (iss)
    string sub = 4;             // Subject claim (sub)
}

message SignMetadataReply {
    string signed_metadata = 1; // The resulting signed JWT
}

// GetIACAsReply contains the IACA (Issuing Authority CA) certificates
// for mDOC verification. Certificates are DER-encoded X.509 in bytes.
message GetIACAsReply {
    repeated bytes certificates = 1; // DER-encoded X.509 IACA certificates
}

message MakeSDJWTRequest {
    string scope = 1;
    bytes documentData = 2;
    jwk jwk =3;
    reserved 4;                  // was: string vct_url (removed – issuer must not fetch arbitrary URLs)
    string integrity = 5;
    bytes vctm = 6;              // Raw VCTM JSON bytes (provided by APIGW, avoids issuer fetching URL)
}

message MakeSDJWTReply {
   repeated Credential credentials = 1;
   int64 token_status_list_section = 2; // Token Status List section
   int64 token_status_list_index = 3;   // Token Status List index
}

// MakeJWPRequest is the request for creating a blind BBS credential in JWP
// Compact Serialization (draft-bormann-jwp-modular-bbs).
//
// Unlike every other Make* request here, this one carries material the
// WALLET produced: the credential is signed over a commitment the holder
// built, so the issuer cannot make one on its own. There is no `jwk`
// field for the same reason - key binding is inside the commitment, as a
// Schnorr key in the signature's own group, not an ECDSA proof-of-possession
// key supplied alongside.
message MakeJWPRequest {
    string scope = 1;             // Credential scope (e.g., "pid_jwp")
    bytes document_data = 2;      // JSON encoded issuer claims
    bytes commitment = 3;         // Holder's commitment_with_proof, raw bytes (already base64url-decoded)
    repeated string holder_pointers = 4; // RFC 6901 pointers naming the committed claims, in message order
    string vct = 5;               // Credential type identifier, stamped into the JWP issuer header. Spelled the way SD-JWT VC spells it, on purpose: one type identifier across formats.
    bool key_binding = 6;         // Whether the commitment carries key binding keys
}

message MakeJWPReply {
   repeated Credential credentials = 1;
   int64 token_status_list_section = 2; // Token Status List section
   int64 token_status_list_index = 3;   // Token Status List index
}

// MakeMDocRequest is the request for creating an mdoc document (ISO 18013-5)
message MakeMDocRequest {
    string scope = 1;            // Credential scope (e.g., "pid_mdoc", "mdl")
    reserved 2;                  // was: string doc_type (removed – doctype now comes from mddl)
    bytes document_data = 3;     // JSON encoded mdoc data
    bytes device_public_key = 4; // CBOR encoded COSE_Key for holder's device
    string device_key_format = 5; // Format: "cose", "jwk", or "x509" (default: "cose")
    bytes mddl = 6;               // Raw MDDL (mso_mdoc) schema JSON bytes (provided by APIGW, avoids issuer fetching URL)
}

// MakeMDocReply contains the issued mdoc credential (any doctype, e.g. mDL or PID)
message MakeMDocReply {
    bytes mdoc = 1;              // CBOR encoded mDoc Document
    int64 status_list_section = 2; // Token Status List section (if revocation enabled)
    int64 status_list_index = 3;   // Token Status List index
    string valid_from = 4;         // RFC3339 timestamp
    string valid_until = 5;        // RFC3339 timestamp
}

message Credential {
   string credential = 1;
}

message Empty {
}

message JwksReply {
    string issuer = 1;
    keys jwks = 2;
}

message keys {
    repeated jwk keys = 1;
}

message jwk {
    string kid = 1;
    string crv = 2;
    string kty = 3;
    string x = 4;
    string y = 5;
    string d = 6;
    repeated string key_ops = 7;
    bool ext = 8;
    string n = 9;
    string e = 10;
    string alg = 11;
    string use = 12;
}

// MakeVC20Request is the request for creating a W3C VC 2.0 Data Integrity credential
message MakeVC20Request {
    string scope = 1;                     // Credential scope (e.g., "pid", "ehic")
    bytes document_data = 2;              // JSON encoded credential subject data
    repeated string credential_types = 3; // Credential types (e.g., ["VerifiableCredential", "PersonIdentificationData"])
    string subject_did = 4;               // Optional subject DID for holder binding
    string cryptosuite = 5;               // Cryptosuite: "ecdsa-rdfc-2019", "ecdsa-sd-2023", or "eddsa-rdfc-2022"
    repeated string mandatory_pointers = 6; // JSON pointers for mandatory claims (SD-2023 only)
}

// MakeVC20Reply contains the issued W3C VC 2.0 credential
message MakeVC20Reply {
    bytes credential = 1;              // JSON-LD encoded credential with Data Integrity proof
    string credential_id = 2;          // The credential's unique ID (urn:uuid:...)
    int64 status_list_section = 3;     // Status list section (if revocation enabled)
    int64 status_list_index = 4;       // Status list index
    string valid_from = 5;             // RFC3339 timestamp
    string valid_until = 6;            // RFC3339 timestamp (optional)
}