syntax = "proto3";

package v1.registry;

option go_package = "github.com/SUNET/vc/internal/gen/registry/apiv1_registry";

import "v1-status-model.proto";

service RegistryService {
    // Token Status List operations
    rpc TokenStatusListAddStatus (TokenStatusListAddStatusRequest) returns (TokenStatusListAddStatusReply) {}
    rpc TokenStatusListUpdateStatus (TokenStatusListUpdateStatusRequest) returns (TokenStatusListUpdateStatusReply) {}
    // Credential subject operations
    rpc SaveCredentialSubject (SaveCredentialSubjectRequest) returns (SaveCredentialSubjectReply) {}
    // Service status / readiness
    rpc Status (v1.status.StatusRequest) returns (v1.status.StatusReply) {}
}

// Token Status List messages
message TokenStatusListAddStatusRequest {
    uint32 Status = 1; // Status value (0=VALID, 1=INVALID, 2=SUSPENDED)
}

message TokenStatusListAddStatusReply {
    int64 Section = 1;          // Section where the status was added
    int64 Index = 2;            // Index within the section
    string StatusListUri = 3;   // Full URI to the status list (e.g. "https://registry.sunet.se/statuslists/0")
}

message TokenStatusListUpdateStatusRequest {
    int64 Section = 1;  // Section ID
    int64 Index = 2;    // Index within the section
    uint32 Status = 3;  // New status value (0=VALID, 1=INVALID, 2=SUSPENDED)
}

message TokenStatusListUpdateStatusReply {
    // Empty reply, success indicated by no error
}

// Credential subject messages
message SaveCredentialSubjectRequest {
    string Identifier = 1; // Subject identifier (authentic_source_person_id)
    int64 Section = 2;     // Token Status List section
    int64 Index = 3;       // Token Status List index
}

message SaveCredentialSubjectReply {
    // Empty reply, success indicated by no error
}
