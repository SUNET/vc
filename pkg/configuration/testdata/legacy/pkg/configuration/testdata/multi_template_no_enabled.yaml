templates:
  - id: "tmpl_a"
    name: "Template A"
    version: "1.0"
    oidc_scopes:
      - "scope_a"
    dcql:
      credentials:
        - id: "cred_a"
          format: "vc+sd-jwt"
          meta:
            vct_values:
              - "urn:test:a"
          claims:
            - path: ["name"]
    claim_mappings:
      name: "name"

  - id: "tmpl_b"
    name: "Template B"
    version: "1.0"
    oidc_scopes:
      - "scope_b"
    dcql:
      credentials:
        - id: "cred_b"
          format: "vc+sd-jwt"
          meta:
            vct_values:
              - "urn:test:b"
          claims:
            - path: ["value"]
    claim_mappings:
      value: "value"
