# EUDI EHIC (European Health Insurance Card) Presentation Request
templates:
  - id: "eudi_ehic_standard"
    name: "EUDI EHIC - Standard Request"
    description: "Request European Health Insurance Card data for healthcare services"
    version: "1.0"
    oidc_scopes:
      - "ehic"
    dcql:
      credentials:
        - id: "eudi_ehic"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "urn:eudi:ehic:1"
              - "urn:eu.europa.ec.eudi:ehic:1"
          claims:
            - path: ["card_number"]
            - path: ["personal_identification_number"]
            - path: ["forename"]
            - path: ["family_name"]
            - path: ["date_of_birth"]
            - path: ["institution_id"]
            - path: ["institution_name"]
            - path: ["institution_country"]
            - path: ["expiry_date"]
    claim_mappings:
      - {path: [card_number], claim: ehic_card_number}
      - {path: [personal_identification_number], claim: pin}
      - {path: [forename], claim: given_name}
      - {path: [family_name], claim: family_name}
      - {path: [date_of_birth], claim: birthdate}
      - {path: [institution_id], claim: competent_institution_id}
      - {path: [institution_name], claim: competent_institution}
      - {path: [institution_country], claim: issuing_country}
      - {path: [expiry_date], claim: card_expiry}
    enabled: true
