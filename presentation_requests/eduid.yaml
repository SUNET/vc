# EUDI eduID (Educational Identity) Presentation Request
# Educational identity credential based on PID ARF 1.8
templates:
  - id: "eduid_basic"
    name: "eduID - Basic Profile"
    description: "Request basic educational identity data"
    version: "1.0"
    oidc_scopes:
      - "eduid"
      - "profile"
    dcql:
      credentials:
        - id: "eduid"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "urn:credential:eduid:1"
          claims:
            - path: ["given_name"]
            - path: ["family_name"]
            - path: ["birthdate"]
            - path: ["email"]
            - path: ["nationalities", null]
    claim_mappings:
      - {path: [given_name], claim: given_name}
      - {path: [family_name], claim: family_name}
      - {path: [birthdate], claim: birthdate}
      - {path: [email], claim: email}
      - {path: [nationalities], claim: nationalities}
    enabled: true

  - id: "eduid_full"
    name: "eduID - Full Profile"
    description: "Request complete educational identity data"
    version: "1.0"
    oidc_scopes:
      - "eduid_full"
    dcql:
      credentials:
        - id: "eduid"
          format: "dc+sd-jwt"
          meta:
            vct_values:
              - "urn:credential:eduid:1"
          claims:
            - path: ["given_name"]
            - path: ["family_name"]
            - path: ["birthdate"]
            - path: ["email"]
            - path: ["phone_number"]
            - path: ["nationalities", null]
            - path: ["personal_administrative_number"]
            - path: ["address"]
            - path: ["place_of_birth"]
            - path: ["sex"]
            - path: ["picture"]
            - path: ["age_equal_or_over"]
            - path: ["issuing_authority"]
            - path: ["issuing_country"]
            - path: ["date_of_expiry"]
            - path: ["date_of_issuance"]
            - path: ["document_number"]
    claim_mappings:
      - {path: [given_name], claim: given_name}
      - {path: [family_name], claim: family_name}
      - {path: [birthdate], claim: birthdate}
      - {path: [email], claim: email}
      - {path: [phone_number], claim: phone_number}
      - {path: [nationalities], claim: nationalities}
      - {path: [personal_administrative_number], claim: personal_administrative_number}
      - {path: [address], claim: address}
      - {path: [place_of_birth], claim: place_of_birth}
      - {path: [sex], claim: sex}
      - {path: [picture], claim: picture}
      - {path: [age_equal_or_over], claim: age_equal_or_over}
      - {path: [issuing_authority], claim: issuing_authority}
      - {path: [issuing_country], claim: issuing_country}
      - {path: [date_of_expiry], claim: date_of_expiry}
      - {path: [date_of_issuance], claim: date_of_issuance}
      - {path: [document_number], claim: document_number}
    enabled: true

