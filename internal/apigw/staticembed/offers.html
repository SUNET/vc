<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Offers</title>
    <link rel="stylesheet" href="/static/bulma.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="importmap">
    {
        "imports": {
            "alpinejs": "/static/alpinejs.esm.min.js",
            "valibot": "/static/valibot.min.js"
        }
    }
    </script>
    <script src="/static/offers.js" type="module"></script>
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body>
    <section class="section" x-data="app()" x-init="init()">
        <div class="container is-max-tablet" style="max-width: 500px;">
            <div class="has-text-centered mb-4">
                <img src="/static/logo.png" alt="Logotype" style="height: 48px;">
            </div>
            <h1 class="title has-text-centered has-text-weight-bold is-size-2" x-ref="title">Credential Offers</h1>
            <template x-if="error">
                <div class="notification is-danger">
                    <p x-text="error"></p>
                </div>
            </template>
            <template x-if="loading">
                <div class="box">
                    <div class="vc-loader">
                        <span class="loader"></span>
                    </div>
                </div>
            </template>
            <template x-if="!loading && !credentialOffer">
                <div class="box">
                    <p class="block">Select which <em>type of credential</em> you want to issue.</p>
                    <form x-ref="offersForm" @submit.prevent="handleOffersForm">
                        <div class="container is-max-tablet">
                            <div class="field">
                                <label class="label" for="credential">Credential</label>
                                <div class="select">
                                    <select id="credential" name="credential" required>
                                        <option value="" disabled selected>Select credential</option>
                                        <template x-for="(cred, id) in credentials" :key="id">
                                            <option :value="id" x-text="cred.name" :title="cred.description"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <input type="submit" value="Submit" class="button is-primary">
                        </div>
                    </form>
                </div>
            </template>
            <template x-if="!loading && credentialOffer">
                <div class="box is-flex is-flex-direction-column is-align-items-center is-gap-2">
                    <h2 class="title has-text-centered has-text-weight-bold is-size-4" x-text="credentialOffer.name"></h2>

                    <!-- 1. Cross-device: scan with whatever wallet is on the phone. -->
                    <p class="has-text-centered">Scan this QR code with the wallet on your mobile device.</p>
                    <img :src="`data:image/png;base64,${credentialOffer.qr.base64_image}`" alt="Credential offer QR code" />

                    <!-- 2. Same-device, over the W3C Digital Credentials API.
                         Rendered only when an openid4vci-v1 request can
                         actually be fulfilled here - see isIssuanceAvailable(). -->
                    <template x-if="issuanceAvailable">
                        <div class="is-flex is-flex-direction-column is-align-items-center is-gap-2 mt-4">
                            <button class="button is-primary" @click="handleIssueOnThisDevice">Open in wallet on this device</button>
                            <p class="has-text-centered is-size-7">Your browser will ask which wallet should receive the credential.</p>
                        </div>
                    </template>
                    <template x-if="issuanceStatus">
                        <div class="notification is-success" style="width: 100%" x-text="issuanceStatus"></div>
                    </template>

                    <!-- 3. One shortcut per configured wallet: the same offer
                         behind that wallet's own redirect URI. -->
                    <template x-if="Object.keys(credentialOffer.wallets).length > 0">
                        <div class="is-flex is-flex-direction-column is-align-items-stretch is-gap-2 mt-4" style="width: 100%">
                            <p class="has-text-centered is-size-7">Or open it directly in a known wallet:</p>
                            <template x-for="(wallet, id) in credentialOffer.wallets" :key="id">
                                <button class="button is-link is-light" x-text="wallet.name" @click="handleOpenInWallet(wallet.uri)"></button>
                            </template>
                        </div>
                    </template>

                    <div class="vc-offer-uri">
                        <pre x-text="credentialOffer.qr.uri"></pre>
                        <button class="vc-copy-btn"
                                type="button"
                                @click="handleCopyOffer"
                                :data-tooltip="copyStatus || 'Copy'"
                                aria-label="Copy credential offer">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <button class="button is-ghost" @click="handleReset">Choose another credential</button>
                </div>
            </template>
        </div>
        <!-- Pass offers data to Alpine component as JSON -->
        <script type="application/json" id="offersData">
{{.offers | json}}
        </script>
    </section>
</body>
</html>
