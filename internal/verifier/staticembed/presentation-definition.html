<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifier</title>
    <link rel="stylesheet" href="/static/bulma.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script type="importmap">
    {
        "imports": {
            "alpinejs": "/static/alpinejs.esm.min.js",
            "valibot": "/static/valibot.min.js",
            "@sirosfoundation/dc-api": "/static/dc-api.js",
            "./dc-api-polyfill.js": "/static/dc-api-polyfill.js"
        }
    }
    </script>
    <script src="/static/presentation-definition.js" type="module"></script>
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body>
    <section class="section" x-data="app">
        <div class="container" style="max-width: 500px;">
            <h1 class="title has-text-weight-bold is-size-2 is-flex is-justify-content-center is-align-items-center is-gap-2" x-ref="title">
                <svg width="40" height="40" aria-label="SUNET">
                    <image href="/static/logo.png" width="40" height="40"></image>
                </svg>
                <span>Verifier</span>
            </h1>
            <template x-if="error">
                <div class="notification is-danger">
                    <p x-text="error"></p>
                </div>
            </template>
            <template x-if="loading">
                <div class="box container">
                    <div class="vc-loader">
                        <span class="loader"></span>
                    </div>
                </div>
            </template>
            <template x-if="!loading && credentialsList && !credentialAttributes && !presentationDefinition && !verificationResult && !verificationExpired">
                <div class="box container">
                    <h2 class="title is-size-6">Preconfigured presentation requests</h2>
                    <div class="buttons is-flex is-flex-direction-column">
                        <template x-for="[key, prePD] in groupedPresetData.featured" :key="key">
                        <button class="button is-light is-fullwidth" @click="handleSelectPredefinedPresentationDefinition(key)" x-text="prePD.label"></button>
                        </template>
                    </div>
                    <template x-if="groupedPresetData.groups.length > 0">
                        <div>
                            <button class="button is-small is-text" @click="showMorePresets = !showMorePresets" :aria-expanded="showMorePresets" x-text="showMorePresets ? 'Show fewer presets' : 'Show more presets'"></button>
                            <template x-if="showMorePresets">
                                <div>
                                    <template x-for="group in groupedPresetData.groups" :key="group.category">
                                        <div class="block">
                                            <p class="title is-size-7" x-text="group.category"></p>
                                            <div class="buttons is-flex is-flex-direction-column">
                                                <template x-for="[key, prePD] in group.presets" :key="key">
                                                <button class="button is-light is-fullwidth" @click="handleSelectPredefinedPresentationDefinition(key)" x-text="prePD.label"></button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <hr>
                    <h2 class="title is-size-6">Create custom presentation requests</h2>
                    <form x-ref="credentialSelectionForm" @submit.prevent="handleCredentialSelectionForm">
                        <div class="field block">
                            <label for="credential-select" class="is-sr-only">Credential type</label>
                            <div class="select is-fullwidth">
                                <select id="credential-select" name="credential" required>
                                    <option disabled selected>Choose type of credential to verify</option>
                                    <template x-for="[id, credAttrs] in Object.entries(credentialsList)">
                                        <option :value="id" x-text="credAttrs.vct">
                                        </option>
                                    </template> 
                                </select>
                            </div>
                        </div>
                        <div class="mt-5 is-flex is-justify-content-flex-end is-align-items-center">
                            <input type="submit" value="Next" class="button is-info">
                        </div>
                    </form>
                </div>
            </template>
            <template x-if="dcApiVerified">
                <div class="box container">
                    <div class="notification is-success">
                        <p>Presentation verified successfully.</p>
                    </div>
                    <div class="mt-5 is-flex is-justify-content-flex-start is-align-items-center">
                        <button class="button is-small is-light" @click.prevent="handleBackToMenu">Back to menu</button>
                    </div>
                </div>
            </template>
            <template x-if="verificationResult">
                <div class="box container">
                    <div class="block is-flex is-justify-content-center is-align-items-center is-flex-direction-column is-fullwidth">
                        <svg class="has-text-success mb-2" style="width:80px" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"></path><path d="m9 11 3 3L22 4"></path></svg>
                        <p class="title is-size-4 has-text-success">Verification succeeded</p>
                    </div>
                    <template x-for="cred in (verificationResult.credential_data || [])" :key="cred.scope">
                        <div class="box" style="overflow:hidden;">
                            <h2 class="title is-size-5 mb-2">Credential claims — <span x-text="cred.scope"></span></h2>
                            <template x-if="cred.credential">
                                <div class="table-container">
                                    <table class="table is-fullwidth is-hoverable">
                                        <thead>
                                            <tr><th>Name</th><th>Value</th></tr>
                                        </thead>
                                        <tbody x-html="renderClaimTree(cred.credential)"></tbody>
                                    </table>
                                </div>
                            </template>
                            <template x-if="!cred.credential">
                                <p><em>No claims available.</em></p>
                            </template>
                            <details class="vc-data-block-details">
                                <summary>Credential data</summary>
                                <pre class="has-background-dark has-text-light p-4 has-border-radius" style="overflow-x:auto;font-size:0.85em;white-space:pre-wrap;word-break:break-all;"><code x-text="JSON.stringify(cleanCredentialForDisplay(cred.credential), null, 2)"></code></pre>
                            </details>
                        </div>
                    </template>
                    <div class="buttons is-centered mt-4">
                        <button class="button is-outlined is-black" @click.prevent="handleBackToMenu">Back to menu</button>
                    </div>
                </div>
            </template>
            <template x-if="verificationExpired">
                <div class="box container">
                    <div class="notification is-warning">
                        <p>The last verification result is no longer available (it may have expired).</p>
                    </div>
                    <div class="buttons is-centered mt-4">
                        <button class="button is-outlined is-black" @click.prevent="handleBackToMenu">Back to menu</button>
                    </div>
                </div>
            </template>
            <template x-if="!loading && credentialsList && credentialAttributes && !presentationDefinition && !dcApiVerified && !verificationResult && !verificationExpired">
                <div class="box container">
                    <form x-ref="attributesSelectionForm" @submit.prevent="handleAttributesSelectionForm">
                        <div class="field block">
                            <p class="title is-size-6">Fields</p>
                            <div class="buttons">
                                <button class="button is-small is-info is-light" @click.prevent="handleAttributesToggle('all')">Select all</button>
                                <button class="button is-small is-info is-light" @click.prevent="handleAttributesToggle('none')">Select none</button>
                            </div>
                            <div class="vc-attributes-list">
                                <ul x-ref="fieldsList">
                                    <template x-for="node of credentialAttributes.claimTree">
                                        <li>
                                            <template x-if="node.children.length === 0">
                                                <label class="checkbox">
                                                    <input type="checkbox" name="attribute[]" :value="node.label" />
                                                    <span x-text="node.label"></span>
                                                </label>
                                            </template>
                                            <template x-if="node.children.length > 0">
                                                <details class="vc-claim-group" open>
                                                    <summary class="vc-claim-group-summary">
                                                        <label class="checkbox" @click.stop>
                                                            <input type="checkbox" aria-label="Toggle all child attributes"
                                                                @change="$el.closest('.vc-claim-group').querySelectorAll(':scope > ul input[type=checkbox]').forEach(cb => cb.checked = $el.checked)" />
                                                            <strong x-text="node.label"></strong>
                                                        </label>
                                                    </summary>
                                                    <ul class="vc-claim-children">
                                                        <template x-for="child of node.children">
                                                            <li>
                                                                <label class="checkbox">
                                                                    <input type="checkbox" name="attribute[]" :value="child.label" />
                                                                    <span x-text="child.label"></span>
                                                                </label>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </details>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                        <div class="mt-5 is-flex is-flex-direction-row-reverse is-justify-content-space-between is-align-items-center">
                            <input type="submit" value="Create request" class="button is-info">
                            <button class="button is-small is-danger is-outlined" @click.prevent="handleResetCancel">Cancel</button>
                        </div>
                    </form>
                </div>
            </template>
            <template x-if="!loading && credentialsList && credentialAttributes && presentationDefinition && !dcApiVerified && !verificationResult && !verificationExpired">
                <div class="box container">
                    <div class="block is-flex is-justify-content-center">
                        <img :src="`data:image/png;base64,${presentationDefinition.qr_code}`" alt="" />
                    </div>
                    <div class="block">
                        <pre class="has-border-radius" x-text="presentationDefinition.authorization_request"></pre>
                    </div>
                    <div class="block buttons is-centered">
                        <template x-for="[label, uri] in Object.entries(redirectUris)">
                            <a :href="uri" class="button" x-text="label" @click="handleWalletClick($event)"></a>
                        </template>
                    </div>
                    <template x-if="dcqlQuery">
                        <div class="block">
                            <details class="vc-data-block-details">
                                <summary>View DCQL Query</summary>
                                <pre><code x-text="JSON.stringify(dcqlQuery, null, 2)"></code></pre>
                            </details>
                        </div>
                    </template>
                    <div class="mt-5 is-flex is-justify-content-flex-start is-align-items-center">
                        <button class="button is-small is-danger is-outlined" @click.prevent="handleBackToMenu">Back to menu</button>
                    </div>
                </div>
            </template>
        </div>
    </section>
</body>
</html>
