          schema:
            $ref: '#/definitions/apiv1.OIDCRPInitiateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: Initiate OIDC Authentication
      tags:
      - OIDCRP
  /op/par:
    post:
      consumes:
      - application/json
      description: Handle OAuth2 Pushed Authorization Request (PAR)
      operationId: oauth-par
      parameters:
      - description: PAR request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/openid4vci.PARRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/openid4vci.ParResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: Pushed Authorization Request
      tags:
      - OAuth
  /token:
    post:
      consumes:
      - application/json
      description: Exchange authorization code for tokens
      operationId: oauth-token
      parameters:
      - description: Token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/openid4vci.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/openid4vci.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: OAuth2 Token
      tags:
      - OAuth
swagger: "2.0"
