        in: query
        name: request_uri
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to consent
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: OAuth2 Authorize
      tags:
