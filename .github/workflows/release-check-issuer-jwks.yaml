name: Release check_issuer_jwks

on:
  push:
    tags:
      - "check-issuer-jwks-v*"

jobs:
  build:
    name: Build check_issuer_jwks (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build check_issuer_jwks
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#check-issuer-jwks-}"
          go build -ldflags "-w -s --extldflags '-static' -X main.version=${VERSION}" \
            -o check_issuer_jwks-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./developer_tools/scripts/check_issuer_jwks/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: check_issuer_jwks-${{ matrix.goos }}-${{ matrix.goarch }}
          path: check_issuer_jwks-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum check_issuer_jwks-* > checksums-sha256.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#check-issuer-jwks-}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "check_issuer_jwks ${{ steps.version.outputs.version }}"
          generate_release_notes: false
          files: |
            artifacts/check_issuer_jwks-*
            artifacts/checksums-sha256.txt
