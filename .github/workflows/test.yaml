name: test-golang
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync dependencies
        run: |
          sed -i '/replace .* => \/tmp/d' go.mod || true          
          go mod vendor

      - name: Run tests
        run: make test