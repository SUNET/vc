name: Update VCTM

# Disabled: registry-cli now handles credential discovery centrally.
# The vctm branch is maintained directly. To regenerate, run manually.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sirosfoundation/mtcvctm@b137c8d2b2aa6a19c701ccbf3cd433b9729f6890 # v1.8.0
        with:
          input-dir: ./credentials
          output-dir: ./vctm
          base-url: https://github.com/${{ github.repository }}/raw/vctm
          vctm-branch: vctm
          commit-message: "Update VCTM files [skip ci]"
