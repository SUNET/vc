<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 829 504" width="829" height="504">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b2c6f"/>
      <stop offset="100%" style="stop-color:#2e1438"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#713688"/>
      <stop offset="100%" style="stop-color:#5b2c6f"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="829" height="504" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Header band -->
  <rect width="829" height="90" rx="24" ry="24" fill="url(#header)"/>
  <rect y="60" width="829" height="30" fill="url(#header)"/>

  <!-- Mortarboard icon -->
  <g transform="translate(48, 20)" fill="white" opacity="0.85">
    <polygon points="20,8 0,18 20,28 40,18"/>
    <rect x="18" y="18" width="4" height="12"/>
    <path d="M8,20 Q8,30 20,30 Q32,30 32,20" fill="none" stroke="white" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="105" y="48" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="1">MICRO-CREDENTIAL</text>
  <text x="105" y="75" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="14" opacity="0.75">Educational Credential</text>

  <!-- Student name -->
  <text x="48" y="140" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" opacity="0.65">Student name</text>
  <text x="48" y="170" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">{{name}}</text>

  <!-- Program -->
  <text x="48" y="225" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" opacity="0.65">Program</text>
  <text x="48" y="255" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">{{program}}</text>

  <!-- ECTS -->
  <text x="48" y="310" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" opacity="0.65">ECTS credits</text>
  <text x="48" y="340" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22">{{ects}}</text>

  <!-- Issuer -->
  <text x="480" y="140" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" opacity="0.65">Issuing university</text>
  <text x="480" y="170" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">{{issuer}}</text>

  <!-- Country -->
  <text x="480" y="215" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="13" opacity="0.65">Country</text>
  <text x="480" y="240" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18">{{country}}</text>

  <!-- Bottom bar -->
  <rect y="400" width="829" height="104" rx="0" ry="0" fill="white" opacity="0.06"/>
  <rect y="480" width="829" height="24" rx="24" ry="24" fill="white" opacity="0.06"/>

  <!-- Valid from -->
  <text x="48" y="435" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="12" opacity="0.6">Valid from</text>
  <text x="48" y="460" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18">{{validFrom}}</text>

  <!-- Valid until -->
  <text x="680" y="435" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="12" opacity="0.6" text-anchor="end">Valid until</text>
  <text x="680" y="460" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">{{validUntil}}</text>

  <!-- Decorative rings -->
  <circle cx="770" cy="445" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  <circle cx="770" cy="445" r="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
</svg>
