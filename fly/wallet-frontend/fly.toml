app = "sunet-vc-wallet-frontend"
primary_region = "arn"

[build]
  image = "ghcr.io/sirosfoundation/wallet-frontend:latest"

[env]
  WALLET_BACKEND_URL = "https://sunet-vc-wallet-backend.fly.dev"
  WALLET_ENGINE_URL = "https://sunet-vc-wallet-backend.fly.dev"
  WEBAUTHN_RPID = "sunet-vc-wallet-frontend.fly.dev"
  OPENID4VCI_REDIRECT_URI = "https://sunet-vc-wallet-frontend.fly.dev"
  STATIC_PUBLIC_URL = "https://sunet-vc-wallet-frontend.fly.dev"
  DELEGATE_TRUST_TO_BACKEND = "true"
  OIDC_GATE_OP_URL = "https://sunet-vc-apigw.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
