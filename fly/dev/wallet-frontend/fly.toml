app = "sunet-vc-wallet-frontend"
primary_region = "arn"

[build]
  image = "ghcr.io/sirosfoundation/wallet-frontend:latest"

# Runs the upstream image's branding helper (populates /usr/share/nginx/branding/custom
# from BRANDING_* env vars) before nginx's normal entrypoint takes over.
[experimental]
  entrypoint = ["/bin/sh", "-c", "BRANDING_OUTPUT_BASE_PATH=/usr/share/nginx/branding /home/node/app/create_custom_branding_resources.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]

[env]
  WALLET_BACKEND_URL = "https://sunet-vc-wallet.fly.dev"
  WALLET_ENGINE_URL = "https://sunet-vc-wallet.fly.dev"
  WEBAUTHN_RPID = "sunet-vc-wallet.fly.dev"
  OPENID4VCI_REDIRECT_URI = "https://sunet-vc-wallet.fly.dev"
  STATIC_PUBLIC_URL = "https://sunet-vc-wallet.fly.dev"
  STATIC_NAME = "SUNET Wallet"
  I18N_WALLET_NAME_OVERRIDE = "SUNET Wallet"
  DELEGATE_TRUST_TO_BACKEND = "true"
  OIDC_GATE_OP_URL = "https://sunet-vc-apigw.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
