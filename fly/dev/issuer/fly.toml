app = "sunet-vc-issuer"
primary_region = "arn"

[build]
  image = "docker.sunet.se/iam_vc/issuer:local"

[env]
  VC_CONFIG_YAML = "/config.yaml"

[[files]]
  guest_path = "/config.yaml"
  local_path = "fly/dev/config.yaml"

[[files]]
  guest_path = "/secrets.yaml"
  local_path = "secrets.sunet-vc.yaml"

[[files]]
  guest_path = "/pki/signing_ec_private.pem"
  secret_name = "SIGNING_EC_PRIVATE_KEY"

[[files]]
  guest_path = "/pki/signing_ec_chain.pem"
  secret_name = "SIGNING_EC_CHAIN"

# IDunion trusted-list certificate: the issuer's credential signing key. Needs
# `./fly/deploy.sh idunion --profile dev` first; a missing secret makes the machine
# fail to start. The signing_ec_* mounts above are kept only for rollback.
[[files]]
  guest_path = "/pki/issuer_signing_private.pem"
  secret_name = "ISSUER_SIGNING_PRIVATE_KEY"

[[files]]
  guest_path = "/pki/issuer_signing_chain.pem"
  secret_name = "ISSUER_SIGNING_CHAIN"

# WeBuild access certificate for issuer metadata signing. Enable only after
# `./fly/deploy.sh wrpac --profile dev --service issuer`; a missing secret
# makes the machine fail to start.
# [[files]]
#   guest_path = "/pki/wrpac_private.pem"
#   secret_name = "WRPAC_PRIVATE_KEY"
#
# [[files]]
#   guest_path = "/pki/wrpac_chain.pem"
#   secret_name = "WRPAC_CHAIN"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# gRPC listens on 8090; reachable via <app>.internal:8090 over 6PN (no
# [[services]] block — that would either publish 8090 to the public IP or
# fail fly config validation).

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
