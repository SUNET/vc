app = "sunet-vc-verifier"
primary_region = "arn"

[build]
  image = "docker.sunet.se/iam_vc/verifier:local"

[env]
  VC_CONFIG_YAML = "/config.yaml"

[[files]]
  guest_path = "/config.yaml"
  local_path = "fly/dev/config.yaml"

[[files]]
  guest_path = "/secrets.yaml"
  local_path = "secrets.sunet-vc.yaml"

[[files]]
  guest_path = "/pki/signing_ec_private.pem"
  secret_name = "SIGNING_EC_PRIVATE_KEY"

[[files]]
  guest_path = "/pki/signing_ec_chain.pem"
  secret_name = "SIGNING_EC_CHAIN"

# WeBuild WRPAC. Needs `./fly/deploy.sh wrpac --profile dev --service verifier` first;
# a missing secret makes the machine fail to start.
[[files]]
  guest_path = "/pki/wrpac_private.pem"
  secret_name = "WRPAC_PRIVATE_KEY"

[[files]]
  guest_path = "/pki/wrpac_chain.pem"
  secret_name = "WRPAC_CHAIN"

# WRPRC: add once issued (the wrpac command stages WRPRC_JWT when verifier-wrprc.jwt exists).
# [[files]]
#   guest_path = "/pki/wrprc.jwt"
#   secret_name = "WRPRC_JWT"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
