app = "sunet-vc-demo-wallet"
primary_region = "arn"

[build]
  image = "caddy:2-alpine"

[env]
  WALLET_BACKEND_UPSTREAM = "sunet-vc-demo-wallet-backend.fly.dev"
  WALLET_FRONTEND_UPSTREAM = "sunet-vc-demo-wallet-frontend.fly.dev"
  # WebSocket engine runs on the wallet-backend's port 8082 (--mode=...,engine),
  # reached over the fly private network; fly-proxy only exposes 8080 publicly.
  WALLET_ENGINE_UPSTREAM = "sunet-vc-demo-wallet-backend.internal:8082"

[[files]]
  guest_path = "/etc/caddy/Caddyfile"
  local_path = "fly/demo/wallet/Caddyfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
