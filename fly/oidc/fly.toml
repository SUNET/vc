app = "sunet-vc-oidc"
primary_region = "arn"

[build]
  image = "docker.sunet.se/iam_vc/mellon:local"

[env]
  KC_HTTP_PORT = "8080"
  KC_HTTP_ENABLED = "true"
  KC_HOSTNAME_URL = "https://sunet-vc-oidc.fly.dev"
  KC_PROXY_HEADERS = "xforwarded"

[[files]]
  guest_path = "/opt/keycloak/data/import/realm.json"
  local_path = "fly/oidc/realm-vc.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
